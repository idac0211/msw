<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 교육 연간 일정 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #ffffff; color: #1e293b; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto w-full">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 bg-white p-8 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-slate-100">
            <div>
                <span class="text-[11px] font-bold text-rose-600 bg-rose-50 px-4 py-1.5 rounded-full tracking-wide uppercase">ITP Design Academy Center</span>
                <h1 class="text-2xl md:text-3xl font-bold text-slate-900 mt-4 tracking-tight">2026년 교육 연간 일정</h1>
            </div>
            <div id="admin-controls" class="hidden mt-4 md:mt-0 flex gap-3">
                <button onclick="openModal()" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-2xl text-sm font-semibold transition shadow-lg shadow-slate-200 whitespace-nowrap">일정 추가</button>
                <button onclick="forceResetData()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-5 py-2.5 rounded-2xl text-sm font-semibold transition whitespace-nowrap">데이터 초기화</button>
            </div>
        </header>

        <!-- Timeline Container -->
        <div id="timeline-container" class="space-y-6"></div>

        <!-- Admin Toggle Footer -->
        <footer class="mt-16 text-center">
            <button id="admin-toggle-btn" onclick="toggleAdminMode()" class="bg-white border border-slate-100 text-slate-400 hover:border-rose-200 hover:text-rose-500 px-6 py-2.5 rounded-full text-xs font-medium flex items-center justify-center gap-2 mx-auto shadow-sm transition">
                <span id="admin-status">🔒 관리자 모드 잠금</span>
            </button>
        </footer>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black/20 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-8 shadow-2xl border border-slate-100">
            <h3 id="modal-title" class="text-xl font-bold text-slate-900 mb-6">일정 추가</h3>
            <form onsubmit="saveSchedule(event)" class="space-y-4">
                <input type="hidden" id="item-id">
                <select id="item-month" class="w-full bg-slate-50 border-transparent rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-500 outline-none">
                    <option value="1월">1월</option><option value="2월">2월</option><option value="3월">3월</option>
                    <option value="4월">4월</option><option value="5월">5월</option><option value="6월">6월</option>
                    <option value="7월">7월</option><option value="8월">8월</option><option value="9월">9월</option><option value="10월">10월</option>
                </select>
                <input type="text" id="item-date" placeholder="날짜 (예: 1/19 ~ 1/28)" required class="w-full bg-slate-50 border-transparent rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-500 outline-none">
                <input type="text" id="item-title" placeholder="과정명" required class="w-full bg-slate-50 border-transparent rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-500 outline-none">
                <input type="text" id="item-type" value="(야간)" class="w-full bg-slate-50 border-transparent rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-500 outline-none">
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 text-sm text-slate-500 font-medium">취소</button>
                    <button type="submit" class="px-5 py-2.5 bg-rose-600 text-white rounded-xl text-sm font-bold shadow-lg shadow-rose-200 hover:bg-rose-700 transition">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let isAdmin = false;
        const ADMIN_PASSWORD = "123";

        let schedules = JSON.parse(localStorage.getItem('tp_schedules')) || [
            { id: 1, month: "1월", date: "1/19 ~ 1/28", title: "생성형 AI 콘텐츠 디자인 퍼블리싱", type: "(야간)" },
            { id: 2, month: "1월", date: "1/20, 1/22", title: "AI를 활용한 디자인 콘텐츠 제작 실무", type: "(주간)" }
        ];

        function renderSchedules() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            const months = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월"];

            months.forEach(month => {
                const monthItems = schedules.filter(s => s.month === month);
                const row = document.createElement('div');
                row.className = "flex flex-col md:flex-row bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden group transition-all duration-300 hover:shadow-md";
                
                row.innerHTML = `
                    <div class="md:w-20 flex-shrink-0 bg-slate-50 flex items-center justify-center p-6 border-b md:border-b-0 md:border-r border-slate-100">
                        <span class="text-lg font-bold text-slate-700">${month}</span>
                    </div>
                    <div class="flex-1 w-full p-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                            ${monthItems.length > 0 ? monthItems.map(item => `
                                <div class="bg-white border border-slate-200 p-4 rounded-2xl relative group/card shadow-sm hover:border-rose-300 hover:shadow-lg hover:shadow-rose-50 transition-all duration-300">
                                    <div class="text-[10px] font-bold text-rose-500 mb-2 uppercase tracking-wider">${item.date}</div>
                                    <div class="text-sm font-semibold text-slate-900 leading-snug">${item.title}</div>
                                    <div class="text-[11px] text-slate-400 mt-2 font-medium">${item.type}</div>
                                    ${isAdmin ? `
                                        <div class="absolute top-2 right-2 flex gap-1 opacity-0 group-hover/card:opacity-100 transition">
                                            <button onclick="editSchedule(${item.id})" class="text-slate-400 hover:text-indigo-600 p-1 bg-white rounded-full shadow border border-slate-100">✏️</button>
                                            <button onclick="deleteSchedule(${item.id})" class="text-slate-400 hover:text-rose-600 p-1 bg-white rounded-full shadow border border-slate-100">✕</button>
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('') : '<p class="text-slate-300 text-sm py-4 italic px-2">등록된 일정이 없습니다.</p>'}
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function toggleAdminMode() {
            if (isAdmin) {
                isAdmin = false;
                document.getElementById('admin-controls').classList.add('hidden');
                document.getElementById('admin-status').innerText = "🔒 관리자 모드 잠금";
            } else {
                const pass = prompt("관리자 비밀번호를 입력하세요:");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.getElementById('admin-controls').classList.remove('hidden');
                    document.getElementById('admin-status').innerText = "🔓 관리자 모드 해제";
                }
            }
            renderSchedules();
        }

        function openModal(id = null) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            
            if(id) {
                const item = schedules.find(s => s.id === id);
                document.getElementById('item-id').value = item.id;
                document.getElementById('item-month').value = item.month;
                document.getElementById('item-date').value = item.date;
                document.getElementById('item-title').value = item.title;
                document.getElementById('item-type').value = item.type;
                title.innerText = "일정 수정";
            } else {
                document.getElementById('item-id').value = "";
                document.getElementById('item-title').value = "";
                document.getElementById('item-date').value = "";
                title.innerText = "일정 추가";
            }
            modal.classList.replace('hidden', 'flex');
        }

        function closeModal() { document.getElementById('modal').classList.replace('flex', 'hidden'); }

        function saveSchedule(e) {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const data = {
                id: id ? parseInt(id) : Date.now(),
                month: document.getElementById('item-month').value,
                date: document.getElementById('item-date').value,
                title: document.getElementById('item-title').value,
                type: document.getElementById('item-type').value
            };

            if(id) {
                const idx = schedules.findIndex(s => s.id === parseInt(id));
                schedules[idx] = data;
            } else {
                schedules.push(data);
            }
            
            localStorage.setItem('tp_schedules', JSON.stringify(schedules));
            closeModal();
            renderSchedules();
        }

        function editSchedule(id) { openModal(id); }

        function deleteSchedule(id) {
            if(confirm("정말 삭제하시겠습니까?")) {
                schedules = schedules.filter(s => s.id !== id);
                localStorage.setItem('tp_schedules', JSON.stringify(schedules));
                renderSchedules();
            }
        }

        function forceResetData() {
            if(confirm("모든 데이터를 초기값으로 되돌릴까요?")) {
                schedules = [{ id: 1, month: "1월", date: "1/19 ~ 1/28", title: "생성형 AI 콘텐츠 디자인 퍼블리싱", type: "(야간)" }];
                localStorage.setItem('tp_schedules', JSON.stringify(schedules));
                renderSchedules();
            }
        }

        renderSchedules();
    </script>
</body>
</html>
