<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인천테크노파크 디자인교육센터 연간 일정</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full uppercase tracking-wider">Incheon TP Design Education Center</span>
                <h1 class="text-2xl font-bold text-slate-900 mt-2">2026년 교육 연간 일정</h1>
            </div>
            <!-- Admin Controls -->
            <div id="admin-controls" class="hidden mt-4 md:mt-0 flex gap-3">
                <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition shadow-sm flex items-center gap-2">
                    새 일정 추가
                </button>
                <button onclick="resetData()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 py-2.5 rounded-xl font-medium text-sm transition shadow-sm">
                    전체 초기화
                </button>
            </div>
        </header>

        <!-- Schedule Grid -->
        <div id="schedule-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Footer Admin Toggle -->
        <footer class="mt-12 text-center">
            <!-- 클릭 영역을 넓히고 확실하게 버튼으로 구성 -->
            <button id="admin-toggle-btn" onclick="toggleAdminMode()" class="bg-white border border-slate-200 hover:border-indigo-300 text-slate-500 hover:text-indigo-600 px-6 py-3 rounded-full text-xs font-medium flex items-center justify-center gap-2 mx-auto shadow-sm transition-all">
                <svg id="lock-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                <span id="admin-status">관리자 모드 활성화</span>
            </button>
        </footer>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl">
            <h3 id="modal-title" class="text-lg font-bold text-slate-900 mb-4">일정 추가</h3>
            <form id="schedule-form" onsubmit="saveSchedule(event)" class="space-y-4">
                <input type="hidden" id="item-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">월</label>
                    <select id="item-month" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm">
                        <option value="1월">1월</option><option value="2월">2월</option><option value="3월">3월</option>
                        <option value="4월">4월</option><option value="5월">5월</option><option value="6월">6월</option>
                        <option value="7월">7월</option><option value="8월">8월</option><option value="9월">9월</option><option value="10월">10월</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">교육 기간</label>
                    <input type="text" id="item-date" placeholder="예: 1/19 ~ 1/28" required class="w-full border border-slate-200 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">교육 과정명</label>
                    <input type="text" id="item-title" required class="w-full border border-slate-200 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">유형</label>
                    <input type="text" id="item-type" value="(야간)" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm">
                </div>
                <div class="flex justify-end gap-2 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm text-slate-600 hover:bg-slate-100">취소</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let isAdmin = false;
        const ADMIN_PASSWORD = "123"; 

        const defaultData = [
            { id: 1, month: "1월", date: "1/19 ~ 1/28", title: "생성형 AI 콘텐츠 디자인 퍼블리싱", type: "(야간)" },
            { id: 2, month: "1월", date: "1/20, 1/22", title: "AI를 활용한 디자인 콘텐츠 제작 실무", type: "(주간)" },
            { id: 3, month: "1월", date: "1/27, 1/29", title: "AI 지식재산권과 브랜드 관리", type: "(주간)" },
            { id: 4, month: "1월", date: "1/28", title: "AI 제품 비주얼 연출컷 제작", type: "(주간)" },
            { id: 5, month: "2월", date: "2/3 ~ 2/12", title: "SNS마케팅 영상디자인", type: "(야간)" },
            { id: 6, month: "2월", date: "2/10", title: "디자이너를 위한 AI 프롬프트 실무", type: "(주간)" },
            { id: 7, month: "2월", date: "2/27", title: "빅데이터 분석과 디자인 활용 실무", type: "(주간)" },
            { id: 8, month: "2월", date: "2/24, 2/26", title: "AI를 활용한 디자인 콘텐츠 제작 실무", type: "(주간)" },
            { id: 9, month: "3월", date: "3/6, 3/13", title: "AI를 활용한 영상 편집 자동화 실무", type: "(주간)" },
            { id: 10, month: "3월", date: "3/23 ~ 4/1", title: "기업 홍보 마케팅 콘텐츠 제작 실무", type: "(야간)" },
            { id: 11, month: "3월", date: "3/20, 3/27", title: "매출향상을 위한 패키지디자인", type: "(주간)" },
            { id: 12, month: "3월", date: "3/26", title: "데이터 기반 디자인 혁신 전략", type: "(주간)" },
            { id: 13, month: "3월", date: "3/31", title: "디자인 AI 챗봇 제작 실무", type: "(주간)" },
            { id: 14, month: "4월", date: "4/7, 4/14", title: "AI 인터랙티브 웹 디자인 실무", type: "(주간)" },
            { id: 15, month: "4월", date: "4/14 ~ 4/23", title: "AI 숏폼 콘텐츠 제작과 마케팅 실무", type: "(야간)" },
            { id: 16, month: "4월", date: "4/20 ~ 4/29", title: "디지털 커머스 디자인 전략기획 실무", type: "(야간)" },
            { id: 17, month: "4월", date: "4/23, 4/30", title: "AI기반 캐릭터 콘텐츠 제작 실무", type: "(주간)" },
            { id: 18, month: "5월", date: "5/14, 5/21", title: "AI 렌더링을 활용한 비주얼라이제이션", type: "(주간)" },
            { id: 19, month: "5월", date: "5/12", title: "AI 제품 비주얼 무빙컷 제작", type: "(주간)" },
            { id: 20, month: "5월", date: "5/13", title: "AI 제품 비주얼 무빙컷 제작", type: "(주간)" },
            { id: 21, month: "5월", date: "5/19 ~ 5/28", title: "생성형 AI 콘텐츠 디자인 퍼블리싱", type: "(야간)" },
            { id: 22, month: "5월", date: "5/22, 5/29", title: "AI 기반 커머스 비주얼 디자인 실무", type: "(주간)" },
            { id: 23, month: "5월", date: "5/28", title: "AI 브랜드 디자인 시스템 구축", type: "(주간)" },
            { id: 24, month: "6월", date: "6/9 ~ 6/18", title: "AI를 활용한 영상 편집 자동화 실무", type: "(주간)" },
            { id: 25, month: "6월", date: "6/15 ~ 6/24", title: "기업 홍보 마케팅 콘텐츠 제작 실무", type: "(야간)" },
            { id: 26, month: "6월", date: "6/25", title: "디자인 AI 챗봇 제작 실무", type: "(주간)" },
            { id: 27, month: "6월", date: "6/30", title: "AI 제품 비주얼 연출컷 제작", type: "(주간)" },
            { id: 28, month: "7월", date: "7/13", title: "빅데이터 분석과 디자인 활용 실무", type: "(주간)" },
            { id: 29, month: "7월", date: "7/16, 7/23", title: "AI 인터랙티브 웹 디자인 실무", type: "(주간)" },
            { id: 30, month: "7월", date: "7/28", title: "디자이너를 위한 AI 프롬프트 실무", type: "(주간)" },
            { id: 31, month: "8월", date: "8/3 ~ 8/12", title: "클라우드 기반 모바일 UX/UI 디자인", type: "(야간)" },
            { id: 32, month: "8월", date: "8/18 ~ 8/27", title: "AI 숏폼 콘텐츠 제작과 마케팅 실무", type: "(야간)" },
            { id: 33, month: "8월", date: "8/22, 8/29", title: "AI 자동화 3D모델링 실습", type: "(야간)" },
            { id: 34, month: "8월", date: "8/24, 8/27", title: "AI 기반 디자인 전략 기획 실무", type: "(주간)" },
            { id: 35, month: "9월", date: "9/7 ~ 9/16", title: "AI 렌더링을 활용한 비주얼라이제이션", type: "(주간)" },
            { id: 36, month: "9월", date: "9/8 ~ 9/17", title: "AI기반 캐릭터 콘텐츠 제작 실무", type: "(야간)" },
            { id: 37, month: "9월", date: "9/10", title: "AI 브랜드 디자인 시스템 구축", type: "(야간)" },
            { id: 38, month: "10월", date: "10/6 ~ 10/15", title: "AI 기반 커머스 비주얼 디자인 실무", type: "(야간)" },
            { id: 39, month: "10월", date: "10월 중(미정)", title: "디지털 커머스 디자인 전략기획 실무", type: "(야간)" }
        ];

        let schedules = JSON.parse(localStorage.getItem('tp_schedules')) || defaultData;

        function renderSchedules() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';
            const months = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월"];

            months.forEach(month => {
                const monthItems = schedules.filter(s => s.month === month);
                if (monthItems.length === 0) return;

                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-100";
                
                const itemsHtml = monthItems.map(item => `
                    <div class="py-3 border-b border-slate-100 last:border-none group">
                        <div class="flex justify-between items-start">
                            <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">${item.date}</span>
                            ${isAdmin ? `
                                <div class="flex gap-1">
                                    <button onclick="editSchedule(${item.id})" class="text-slate-400 hover:text-indigo-600 text-[10px] font-bold">수정</button>
                                    <button onclick="deleteSchedule(${item.id})" class="text-slate-400 hover:text-rose-600 text-[10px] font-bold">삭제</button>
                                </div>
                            ` : ''}
                        </div>
                        <h4 class="text-sm font-bold text-slate-900 mt-1.5">${item.title}</h4>
                        <span class="text-[11px] text-slate-500 mt-0.5 block">${item.type}</span>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="flex items-center justify-between pb-3 mb-2 border-b-2 border-indigo-500">
                        <h3 class="font-bold text-lg text-slate-900">${month}</h3>
                    </div>
                    <div class="divide-y divide-slate-50">${itemsHtml}</div>
                `;
                container.appendChild(card);
            });
        }

        function toggleAdminMode() {
            if (isAdmin) {
                // 잠금 모드로 전환
                isAdmin = false;
                document.getElementById('admin-controls').classList.add('hidden');
                document.getElementById('admin-status').innerText = "관리자 모드 활성화";
            } else {
                // 관리자 모드 시도
                const pass = prompt("관리자 비밀번호를 입력하세요:");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.getElementById('admin-controls').classList.remove('hidden');
                    document.getElementById('admin-status').innerText = "관리자 모드 종료";
                } else {
                    alert("비밀번호가 틀렸습니다.");
                }
            }
            renderSchedules();
        }

        function resetData() {
            if(confirm("전체 데이터를 초기값으로 되돌리시겠습니까?")) {
                schedules = [...defaultData];
                localStorage.setItem('tp_schedules', JSON.stringify(schedules));
                renderSchedules();
            }
        }

        function openAddModal() {
            document.getElementById('modal-title').innerText = "일정 추가";
            document.getElementById('item-id').value = '';
            document.getElementById('schedule-form').reset();
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('flex');
            document.getElementById('modal').classList.add('hidden');
        }

        function saveSchedule(e) {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const data = {
                id: id ? parseInt(id) : Date.now(),
                month: document.getElementById('item-month').value,
                date: document.getElementById('item-date').value,
                title: document.getElementById('item-title').value,
                type: document.getElementById('item-type').value
            };

            if (id) {
                schedules = schedules.map(s => s.id == id ? data : s);
            } else {
                schedules.push(data);
            }
            localStorage.setItem('tp_schedules', JSON.stringify(schedules));
            closeModal();
            renderSchedules();
        }

        function editSchedule(id) {
            const item = schedules.find(s => s.id === id);
            document.getElementById('modal-title').innerText = "일정 수정";
            document.getElementById('item-id').value = item.id;
            document.getElementById('item-month').value = item.month;
            document.getElementById('item-date').value = item.date;
            document.getElementById('item-title').value = item.title;
            document.getElementById('item-type').value = item.type;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function deleteSchedule(id) {
            if (confirm("정말 삭제하시겠습니까?")) {
                schedules = schedules.filter(s => s.id !== id);
                localStorage.setItem('tp_schedules', JSON.stringify(schedules));
                renderSchedules();
            }
        }

        // 초기 렌더링
        renderSchedules();
    </script>
</body>
</html>
