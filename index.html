<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto w-full">

        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 bg-white p-8 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-slate-100">
            <div>
                <span class="text-[11px] font-bold text-red-600 bg-red-50 px-4 py-1.5 rounded-full tracking-wide uppercase">ITP Design Academy Center</span>

    <!-- Modal -->

        <div class="bg-white rounded-3xl max-w-sm w-full p-8 shadow-2xl border border-slate-100">
            <h3 id="modal-title" class="text-xl font-bold text-slate-900 mb-6">일정 추가</h3>
            <form onsubmit="saveSchedule(event)" class="space-y-4">
                <input type="hidden" id="item-id">
                <select id="item-month" class="w-full bg-slate-50 border-transparent rounded-xl p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none">

                    <option value="4월">4월</option><option value="5월">5월</option><option value="6월">6월</option>
                    <option value="7월">7월</option><option value="8월">8월</option><option value="9월">9월</option><option value="10월">10월</option>
                </select>
                <input type="text" id="item-date" placeholder="날짜 (예: 1/19 ~ 1/28)" required class="w-full bg-slate-50 border-transparent rounded-xl p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none">
                <input type="text" id="item-title" placeholder="과정명" required class="w-full bg-slate-50 border-transparent rounded-xl p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none">
                <input type="text" id="item-type" value="(주간)" class="w-full bg-slate-50 border-transparent rounded-xl p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none">
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 text-sm text-slate-500 font-medium">취소</button>
                    <button type="submit" class="px-5 py-2.5 bg-red-600 text-white rounded-xl text-sm font-bold shadow-lg shadow-red-200 hover:bg-red-700 transition">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let isAdmin = false;
        const ADMIN_PASSWORD = "idac0211";

        const initialData = [
            { id: 1, month: "1월", date: "1/19 ~ 1/28", title: "생성형 AI 콘텐츠 디자인 퍼블리싱", type: "(야간)" },

            { id: 7, month: "2월", date: "2/27", title: "빅데이터 분석과 디자인 활용 실무", type: "(주간)" },
            { id: 8, month: "2월", date: "2/24, 2/26", title: "AI를 활용한 디자인 콘텐츠 제작 실무", type: "(주간)" },
            { id: 9, month: "3월", date: "3/6, 3/13", title: "AI를 활용한 영상 편집 자동화 실무", type: "(주간)" },
            { id: 10, month: "3월", date: "3/23 ~ 4/1", title: "기업 홍보 마케팅 콘텐츠 제작 실무", type: "(주간)" },
            { id: 11, month: "3월", date: "3/20, 3/27", title: "매출향상을 위한 패키지디자인", type: "(주간)" },
            { id: 12, month: "3월", date: "3/26", title: "데이터 기반 디자인 혁신 전략", type: "(주간)" },
            { id: 13, month: "3월", date: "3/31", title: "디자인 AI 챗봇 제작 실무", type: "(주간)" },
            { id: 14, month: "4월", date: "4/7, 4/14", title: "AI 인터랙티브 웹 디자인 실무", type: "(주간)" },
            { id: 15, month: "4월", date: "4/14 ~ 4/23", title: "AI숏폼 콘텐츠 제작과 마케팅 실무", type: "(주간)" },
            { id: 16, month: "4월", date: "4/20 ~ 4/29", title: "디지털 커머스 디자인 전략기획 실무", type: "(주간)" },
            { id: 17, month: "4월", date: "4/23, 4/30", title: "AI기반 캐릭터 콘텐츠 제작 실무", type: "(주간)" },
            { id: 18, month: "5월", date: "5/14, 5/21", title: "AI 렌더링을 활용한 비주얼라이제이션", type: "(주간)" },
            { id: 19, month: "5월", date: "5/12", title: "AI 제품 비주얼 무빙컷 제작", type: "(주간)" },
            { id: 20, month: "5월", date: "5/13", title: "AI 제품 비주얼 무빙컷 제작", type: "(주간)" },
            { id: 21, month: "5월", date: "5/19 ~ 5/28", title: "생성형 AI 콘텐츠 디자인 퍼블리싱", type: "(주간)" },
            { id: 22, month: "5월", date: "5/22, 5/29", title: "AI 기반 커머스 비주얼 디자인 실무", type: "(주간)" },
            { id: 23, month: "5월", date: "5/28", title: "AI 브랜드 디자인 시스템 구축", type: "(주간)" },
            { id: 24, month: "6월", date: "6/9 ~ 6/18", title: "AI를 활용한 영상 편집 자동화 실무", type: "(주간)" },
            { id: 25, month: "6월", date: "6/15 ~ 6/24", title: "기업 홍보 마케팅 콘텐츠 제작 실무", type: "(주간)" },
            { id: 26, month: "6월", date: "6/25", title: "디자인 AI 챗봇 제작 실무", type: "(주간)" },
            { id: 27, month: "6월", date: "6/30", title: "AI 제품 비주얼 연출컷 제작", type: "(주간)" },
            { id: 28, month: "7월", date: "7/13", title: "빅데이터 분석과 디자인 활용 실무", type: "(주간)" },
            { id: 29, month: "7월", date: "7/16, 7/23", title: "AI 인터랙티브 웹 디자인 실무", type: "(주간)" },
            { id: 30, month: "7월", date: "7/28", title: "디자이너를 위한 AI 프롬프트 실무", type: "(주간)" },
            { id: 31, month: "8월", date: "8/3 ~ 8/12", title: "클라우드 기반 모바일 UX/UI 디자인", type: "(야간)" },
            { id: 32, month: "8월", date: "8/18 ~ 8/27", title: "AI 숏폼 콘텐츠 제작과 마케팅 실무", type: "(야간)" },
            { id: 33, month: "8월", date: "8/22, 8/29", title: "AI 자동화 3D모델링 실습", type: "(주말)" },
            { id: 34, month: "8월", date: "8/24, 8/27", title: "AI 기반 디자인 전략 기획 실무", type: "(주간)" },
            { id: 35, month: "9월", date: "9/7 ~ 9/16", title: "AI 렌더링을 활용한 비주얼라이제이션", type: "(야간)" },
            { id: 36, month: "9월", date: "9/8 ~ 9/17", title: "AI기반 캐릭터 콘텐츠 제작 실무", type: "(야간)" },
            { id: 37, month: "9월", date: "9/10", title: "AI 브랜드 디자인 시스템 구축", type: "(야간)" },
            { id: 38, month: "10월", date: "10/6 ~ 10/15", title: "AI 기반 커머스 비주얼 디자인 실무", type: "(야간)" },
            { id: 39, month: "10월", date: "10월 중(미정)", title: "디지털 커머스 디자인 전략기획 실무", type: "(야간)" }
        ];

        let schedules = JSON.parse(localStorage.getItem('tp_schedules')) || initialData;

        function renderSchedules() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            const months = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월"];

            months.forEach(month => {
                const monthItems = schedules.filter(s => s.month === month);
                const row = document.createElement('div');
                row.className = "flex flex-col md:flex-row bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden group transition-all duration-300 hover:shadow-md";
                
                row.innerHTML = `
                    <div class="md:w-20 flex-shrink-0 bg-red-50 flex items-center justify-center p-4 md:p-6 border-b md:border-b-0 md:border-r border-red-100">
                        <span class="text-lg font-bold text-red-600 whitespace-nowrap">${month}</span>
                    </div>
                    <div class="flex-1 w-full p-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                            ${monthItems.length > 0 ? monthItems.map(item => `
                                <div class="bg-white border border-slate-200 p-4 rounded-2xl relative group/card shadow-sm hover:border-red-300 hover:shadow-lg hover:shadow-red-50 transition-all duration-300">
                                    <div class="text-[10px] font-bold text-red-500 mb-2 uppercase tracking-wider">${item.date}</div>
                                    <div class="text-sm font-semibold text-slate-900 leading-snug">${item.title}</div>
                                    <div class="text-[11px] text-slate-400 mt-2 font-medium">${item.type}</div>
                                    ${isAdmin ? `
                                        <div class="absolute top-2 right-2 flex gap-1 opacity-0 group-hover/card:opacity-100 transition">
                                            <button onclick="editSchedule(${item.id})" class="text-slate-400 hover:text-red-600 p-1 bg-white rounded-full shadow border border-slate-100">✏️</button>
                                            <button onclick="deleteSchedule(${item.id})" class="text-slate-400 hover:text-red-600 p-1 bg-white rounded-full shadow border border-slate-100">✕</button>
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('') : '<p class="text-slate-300 text-sm py-4 italic px-2">등록된 일정이 없습니다.</p>'}
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function toggleAdminMode() {
            if (isAdmin) {
                isAdmin = false;
                document.getElementById('admin-controls').classList.add('hidden');
                document.getElementById('admin-status').innerText = "🔒 관리자 모드 잠금";
            } else {
                const pass = prompt("관리자 비밀번호를 입력하세요:");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.getElementById('admin-controls').classList.remove('hidden');
                    document.getElementById('admin-status').innerText = "🔓 관리자 모드 해제";
                } else {
                    alert("비밀번호가 올바르지 않습니다.");
                }
            }
            renderSchedules();
        }

        function openModal(id = null) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            
            if(id) {
                const item = schedules.find(s => s.id === id);
                document.getElementById('item-id').value = item.id;
                document.getElementById('item-month').value = item.month;
                document.getElementById('item-date').value = item.date;
                document.getElementById('item-title').value = item.title;
                document.getElementById('item-type').value = item.type;
                title.innerText = "일정 수정";
            } else {
                document.getElementById('item-id').value = "";
                document.getElementById('item-title').value = "";
                document.getElementById('item-date').value = "";
                title.innerText = "일정 추가";
            }
            modal.classList.replace('hidden', 'flex');
        }

        function closeModal() { document.getElementById('modal').classList.replace('flex', 'hidden'); }

        function saveSchedule(e) {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const data = {
                id: id ? parseInt(id) : Date.now(),
                month: document.getElementById('item-month').value,
                date: document.getElementById('item-date').value,
                title: document.getElementById('item-title').value,
                type: document.getElementById('item-type').value
            };

            if(id) {
                const idx = schedules.findIndex(s => s.id === parseInt(id));
                schedules[idx] = data;
            } else {
                schedules.push(data);
            }
            
            localStorage.setItem('tp_schedules', JSON.stringify(schedules));
            closeModal();
            renderSchedules();
        }

        function editSchedule(id) { openModal(id); }

        function deleteSchedule(id) {
            if(confirm("정말 삭제하시겠습니까?")) {
                schedules = schedules.filter(s => s.id !== id);
                localStorage.setItem('tp_schedules', JSON.stringify(schedules));
                renderSchedules();
            }
        }

        function forceResetData() {
            if(confirm("모든 데이터를 초기값으로 되돌릴까요?")) {
                schedules = initialData;
                localStorage.setItem('tp_schedules', JSON.stringify(schedules));
                renderSchedules();
            }
        }

        renderSchedules();
    </script>
</body>
</html>
